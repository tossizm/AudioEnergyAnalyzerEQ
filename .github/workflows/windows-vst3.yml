name: Build AudioEnergyAnalyzerEQ VST3 (Windows)

'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: cmake -S . -B build -A x64

      - name: Build VST3
        run: cmake --build build --config Release --target AudioEnergyAnalyzerEQ_VST3

      - name: Package VST3 in DAW-compatible folder layout
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $binaryCandidates = Get-ChildItem -Path "build" -Recurse -File -Filter "AudioEnergyAnalyzerEQ.vst3" |
            Where-Object { $_.FullName -match "[\\/]Contents[\\/]x86_64-win[\\/]" }

          if (!$binaryCandidates) {
            Write-Host "No AudioEnergyAnalyzerEQ VST3 binary found. Build output tree follows:"
            Get-ChildItem -Path "build" -Recurse -Force |
              Select-Object -ExpandProperty FullName |
              Select-Object -First 300 |
              ForEach-Object { Write-Host $_ }
            throw "VST3 binary not found under build/**/Contents/x86_64-win/AudioEnergyAnalyzerEQ.vst3"
          }

          $binary = $binaryCandidates | Select-Object -First 1
          $bundle = $binary.Directory.Parent.Parent
          Write-Host "Detected bundle: $($bundle.FullName)"
          Write-Host "Detected binary: $($binary.FullName)"

          $json = "config\Reference_Average_Default.json"
          if (!(Test-Path $json -PathType Leaf)) { throw "Reference JSON not found: $json" }

          if (Test-Path "dist") { Remove-Item "dist" -Recurse -Force }
          $installRoot = "dist\Tossizm"
          New-Item -ItemType Directory -Path $installRoot -Force | Out-Null
          $destinationBundle = Join-Path $installRoot "AudioEnergyAnalyzerEQ.vst3"
          Copy-Item -Path $bundle.FullName -Destination $destinationBundle -Recurse -Force
          Copy-Item -Path $json -Destination "dist" -Force

          $expected = "dist\Tossizm\AudioEnergyAnalyzerEQ.vst3\Contents\x86_64-win\AudioEnergyAnalyzerEQ.vst3"
          if (!(Test-Path $expected -PathType Leaf)) {
            Get-ChildItem -Path $destinationBundle -Recurse -Force | Select-Object -ExpandProperty FullName | ForEach-Object { Write-Host $_ }
            throw "Packaged VST3 binary missing: $expected"
          }

          $zip = "AudioEnergyAnalyzerEQ-Windows-VST3.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "dist\*" -DestinationPath $zip -Force
          if (!(Test-Path $zip -PathType Leaf)) { throw "Artifact ZIP was not created" }
          Write-Host "Packaged install path: Tossizm\AudioEnergyAnalyzerEQ.vst3\Contents\x86_64-win\AudioEnergyAnalyzerEQ.vst3"

      - name: Upload Windows VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: AudioEnergyAnalyzerEQ-Windows-VST3
          path: AudioEnergyAnalyzerEQ-Windows-VST3.zip
          if-no-files-found: error
