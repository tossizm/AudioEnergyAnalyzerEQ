```yaml
name: Build ClubAudioAnalyzer EQ VST3

'on':
  push:
    branches:
      - main
      - master
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-windows-vst3:
    name: Build Windows VST3
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Verify Visual Studio
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          if (!(Test-Path $vswhere)) {
            throw "vswhere.exe not found"
          }

          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath

          if (!$vs) {
            throw "Visual Studio C++ build tools not found"
          }

          Write-Host "Visual Studio: $vs"
          cmake --version

          if ($LASTEXITCODE -ne 0) {
            throw "CMake not available"
          }

      - name: Enable MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64

          if ($LASTEXITCODE -ne 0) {
            throw "CMake configure failed"
          }

      - name: Build VST3
        shell: pwsh
        run: |
          cmake --build build --config Release --target ClubAudioAnalyzerEQ_VST3 --parallel

          if ($LASTEXITCODE -ne 0) {
            throw "VST3 build failed"
          }

      - name: Package VST3
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $plugin = Get-ChildItem -Path build -Recurse -Directory -Filter "ClubAudioAnalyzer EQ.vst3" |
            Select-Object -First 1

          if (!$plugin) {
            throw "VST3 bundle not found"
          }

          $json = "config\Reference_Average_Default.json"

          if (!(Test-Path $json)) {
            throw "Reference JSON not found: $json"
          }

          if (Test-Path "dist") {
            Remove-Item "dist" -Recurse -Force
          }

          New-Item -ItemType Directory -Path "dist" -Force | Out-Null

          Copy-Item -Path $plugin.FullName -Destination "dist" -Recurse -Force
          Copy-Item -Path $json -Destination "dist" -Force

          Compress-Archive -Path "dist\*" -DestinationPath "ClubAudioAnalyzerEQ-Windows-VST3.zip" -Force

          if (!(Test-Path "ClubAudioAnalyzerEQ-Windows-VST3.zip")) {
            throw "Artifact ZIP was not created"
          }

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClubAudioAnalyzerEQ-Windows-VST3
          path: ClubAudioAnalyzerEQ-Windows-VST3.zip
          if-no-files-found: error
          retention-days: 30
```
