name: Windows VST3 Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build VST3
        run: cmake --build build --config Release --target AudioEnergyAnalyzerEQ_VST3 --parallel

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: AudioEnergyAnalyzerEQ-Windows-VST3
          path: build/AudioEnergyAnalyzerEQ_artefacts/Release/VST3/AudioEnergyAnalyzerEQ.vst3
          if-no-files-found: error
